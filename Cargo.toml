[workspace]
resolver = "2"
members = [
    "crates/vulkan-core",
    "crates/vulkan-py",
    "crates/vulkan-wasm",
    "crates/vulkan-node",
    "crates/vulkan-miner",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Vulkan Contributors"]

[workspace.dependencies]
vulkan-core = { path = "crates/vulkan-core" }
sha2 = "0.10"
k256 = { version = "0.13", features = ["ecdsa", "sha256", "pkcs8"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
num-bigint = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
hex = "0.4"
tokio = { version = "1", features = ["full"] }
axum = "0.7"