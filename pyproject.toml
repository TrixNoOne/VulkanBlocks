[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "vulkan"
version = "0.1.0"
description = "Python wrapper for the Vulkan blockchain core"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "hypothesis>=6",
    "ruff>=0.3",
    "mypy>=1.8",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.scripts]
vulkan = "vulkan.cli:main"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "vulkan.native"
python-source = "python"

[tool.mypy]
strict = true
python_version = "3.11"